<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<title>PLAYDATE FUN TIMES</title>

	<link rel="stylesheet" href="./css/app.css">
	<link rel="stylesheet" href="./css/cards.css">
	<link rel="stylesheet" href="./css/form.css">
	<link rel="stylesheet" href="./css/header.css">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

	<script defer src="./js/main.js"></script>
</head>

<body>

	<header>
		<img src="./images/header-playdate-dev.png" alt="anyone can make games">
	</header>

	<main>
		<form action="" class="addingForm">
			<div class="headingArea">
				<label for="heading">Zadaj text nadpisu:</label>
				<input type="text" name="heading" id="heading">
			</div>
			<div class="paragraphArea">
				<label for="paragraph">Zadaj text odstavca:</label>
				<textarea name="paragraph" id="paragraph" rows="5"></textarea>
			</div>
			<div class="toStartArea">
				<label for="toStart">Na začiatok?</label>
				<input type="checkbox" id="toStart">
			</div>
			<div class="buttonArea">
				<button id="button">Pridať kartu z formulára</button>
				<button type="button" onclick="pridajKartyJSON()">Pridať karty z JSON</button>
			</div>
		</form>

		<section class="cards">
			<ul class="card-list">
				<li class="sdk">
					<h3>Harry Potter</h3>

					<p>
						Príbehy nezbedného čarodejníka z Bradavic,
						ktorý sa snaží poraziť VyVieteKoho
					</p>
				</li>

				<li class="inside">
					<h3>Stopárov sprievodca galaxiou</h3>

					<p>
						Viete, aká je odpoveď na základnú otázku života, vesmíru a vôbec?
					</p>
				</li>

				<li class="caps">
					<h3>Pena dní</h3>

					<p>
						Vymazlená, hravá a bezbeehá fantázia.
					</p>
				</li>

			</ul>
		</section>
	</main>

</body>

</html>
